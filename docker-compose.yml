services:
  wxread:
    build: .
    image: wxread:local
    container_name: wxread
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 每次间隔随机 20–40 秒，默认 40 次约 20 分钟
      READ_NUM: "${READ_NUM:-40}"
      CRON_SCHEDULE: "${CRON_SCHEDULE:-30 6 * * *}"
