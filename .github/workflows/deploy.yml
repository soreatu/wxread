name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 早间任务：北京时间每天 07:00
    # - cron: '0 7 * * *'
    #   timezone: 'Asia/Shanghai'
    # 每日任务：北京时间每天 06:30
    - cron: '30 06 * * *'
      timezone: 'Asia/Shanghai'
    # 晚间任务：北京时间每天 20:00
    # - cron: '0 20 * * *'
    #   timezone: 'Asia/Shanghai'
  workflow_dispatch:  # 手动触发
    inputs:
      read_num:
        description: '本次阅读次数；填 1 可快速验证，留空使用仓库 READ_NUM'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 cryptography==50.0.2 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Configure encrypted cookie path
      run: echo "WXREAD_COOKIE_FILE=$RUNNER_TEMP/wxread-auth/cookies.enc" >> "$GITHUB_ENV"

    - name: Determine encrypted cookie cache key
      id: auth_cache_key
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
      run: |
        fingerprint=$(python cookie_store.py cache-key)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore encrypted cookies
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/wxread-auth/cookies.enc
        key: wxread-auth-v1-${{ steps.auth_cache_key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          wxread-auth-v1-${{ steps.auth_cache_key.outputs.fingerprint }}-

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ inputs.read_num || vars.READ_NUM }}

      run: |
        python main.py

    - name: Check for encrypted cookie state
      id: auth_state
      if: ${{ always() && steps.auth_cache_key.outcome == 'success' }}
      run: |
        if [ -s "$WXREAD_COOKIE_FILE" ]; then
          echo 'exists=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Save encrypted cookies
      if: ${{ always() && steps.auth_state.outputs.exists == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/wxread-auth/cookies.enc
        key: wxread-auth-v1-${{ steps.auth_cache_key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
